name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TypeSafe SDK
        run: python -m pip install --upgrade typesafe-sdk
      - name: Compile helper
        run: python -m py_compile skills/jev-decision-support/scripts/jev_decision.py skills/jev-decision-support/scripts/test_jev_decision.py
      - name: Run offline contract tests
        working-directory: skills/jev-decision-support/scripts
        run: python test_jev_decision.py
